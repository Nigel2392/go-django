# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Test package Djester
on:
  # Trigger on push to specific branches or all branches
  push:
    paths:
      - 'src/go.mod'
      - 'djester/**/*.go'

      - 'go.work'
      - 'go.mod'
      - '.github/workflows/*'

  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - '.github/workflows/*'

jobs:
  build:
    env:
      # See contrib/admin/middleware.go for more information
      GITHUB_ACTIONS: 1

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go 1.24
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Normal Tests for SQLite
      run: go test -p=1 -v --tags="testing_auth test sqlite" ./djester/...

    - name: Normal Tests for Local MySQL server
      run: go test -p=1 -v --tags="testing_auth test mysql_local" ./djester/...
